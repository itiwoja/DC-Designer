appId: io.github.itiwoja.dcdesigner
productName: DC-Designer
electronVersion: 45.0.0
directories:
  app: .desktop-stage/app
  output: release
asar: true
files:
  - dist/**
  - build/**
  - package.json
  - LICENSE
  # 依存はすべて束ねてある。ステージに node_modules が無いと builder が上のディレクトリの node_modules を拾うので明示的に外す
  - "!**/node_modules/**"
asarUnpack:
  - build/desktop/worker.mjs
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
win:
  icon: desktop/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # 公開時の名前と同じにする（空白があると Releases で別名に置き換わる）
  artifactName: DC-Designer-Setup-${version}.${ext}
  installerIcon: desktop/assets/icon.ico
  uninstallerIcon: desktop/assets/icon.ico
  oneClick: false
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
# 更新確認の先（resources/app-update.yml に書かれる）。公開は CI が行うので、builder 自身は publish しない（--publish never）
publish:
  provider: github
  owner: itiwoja
  repo: DC-Designer
